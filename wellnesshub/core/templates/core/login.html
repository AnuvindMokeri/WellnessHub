{% extends 'core/base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-card">
    <span class="eyebrow">Welcome back</span>
    <h2>Log in to WellnessHub</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="form-footer">
      New here? <a href="{% url 'customer_signup' %}">Create an account</a> ·
      <a href="{% url 'vendor_signup' %}">Sell on WellnessHub</a>
    </div>
  </div>
</div>
{% endblock %}
