{% extends 'core/base.html' %}
{% block title %}Business profile{% endblock %}
{% block content %}
<div class="container section">
  <div class="page-header"><span class="eyebrow">Vendor</span><h1>Business profile</h1></div>
  <div class="dash-grid">
    {% include 'core/_vendor_nav.html' with active='profile' %}
    <div class="form-card" style="max-width:none;">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
